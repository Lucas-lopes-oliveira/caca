
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caça ao Tesouro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 12px #0002;
            width: 90%;
            max-width: 400px;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            margin-bottom: 15px;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #198754;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #146c43;
        }

        #resultado {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            white-space: pre-line;
        }
    </style>
</head>

<body>

    <div class="container">
        <input type="password" id="senha" maxlength="4">

        <button onclick="verificarSenha()">Verificar</button>

        <p id="resultado"></p>
    </div>

    <script>
        function verificarSenha() {
            const senha = document.getElementById("senha").value;
            const resultado = document.getElementById("resultado");

            if (senha === "0512") {
                resultado.textContent = "CHURRASQUEIRA";
                resultado.style.color = "#198754";
            } else {
                resultado.textContent = "Senha incorreta!\n Leia a pista atentamente.";
                resultado.style.color = "#dc3545";
            }
        }
    </script>

</body>
</html>
